name: Delivery3 agenda panel

on:
  push:
    branches:
      - codex/delivery3-agenda-consistency

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/delivery3-agenda-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Apply guarded Agenda patch
        run: node scripts/apply-delivery3-agenda-panel.mjs
      - name: Focused panel contracts
        run: npx vitest run src/modules/petshop/lib/agendaPanelPresentation.test.js
      - name: Architecture boundaries
        run: |
          npm run check:product-ui
          npm run check:no-domain-state-from-dom
          npm run check:appointment-edit-semantics
      - name: Edge validation
        run: |
          npm run edge:typecheck
          npm run test --workspace @yuisync/edge-api -- appointmentCommandIntegration.test.ts
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser appointment panel
        run: npx playwright test test/e2e/agenda-appointment-panel.spec.js
      - name: Commit validated integration
        run: |
          rm .github/workflows/delivery3-agenda-panel.yml scripts/apply-delivery3-agenda-panel.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(delivery3): add consistent Agenda appointment panel"
          git push origin HEAD:codex/delivery3-agenda-consistency
