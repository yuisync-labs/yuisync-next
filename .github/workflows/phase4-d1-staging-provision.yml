name: Phase 4 D1 staging rollback validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: phase4-d1-staging-rollback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'phase/04-data-access-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: yuisync-next-staging
      STAGING_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore and validate current foundation
        run: |
          npm ci
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run edge:check

      - name: Verify migration remains applied
        working-directory: apps/edge-api
        run: >-
          npx wrangler d1 execute "$D1_DATABASE_NAME" --env staging --remote
          --command "SELECT value FROM _yuisync_system_metadata WHERE key = 'schema_version';"

      - name: Deploy D1-enabled staging configuration
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Confirm D1-enabled readiness
        env:
          EXPECTED_DATABASE_STATE: ready
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            BODY_FILE="$(mktemp)"
            STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "$STAGING_URL/ready" || true)"
            if [ "$STATUS" = "200" ] && EXPECTED_DATABASE_STATE="$EXPECTED_DATABASE_STATE" node - "$BODY_FILE" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = body.status === 'ready' && body.checks?.database === process.env.EXPECTED_DATABASE_STATE;
          console.log(JSON.stringify({
            status: body.status,
            database: body.checks?.database,
            environment: body.environment,
            database_latency_ms: body.database_latency_ms,
          }));
          process.exit(valid ? 0 : 1);
          NODE
            then
              rm -f "$BODY_FILE"
              exit 0
            fi
            rm -f "$BODY_FILE"
            sleep $((attempt * 5))
          done
          echo "D1-enabled readiness did not become healthy."
          exit 1

      - name: Prepare rollback configuration without D1 dependency
        run: |
          cp apps/edge-api/wrangler.jsonc "$RUNNER_TEMP/wrangler-d1-enabled.jsonc"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/edge-api/wrangler.jsonc')
          data = json.loads(path.read_text())
          staging = data['env']['staging']
          staging.setdefault('vars', {})['EDGE_DATABASE_ENABLED'] = 'false'
          staging.pop('d1_databases', None)
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Deploy rollback configuration
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Confirm rollback readiness without D1 binding
        env:
          EXPECTED_DATABASE_STATE: disabled
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            BODY_FILE="$(mktemp)"
            STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "$STAGING_URL/ready" || true)"
            if [ "$STATUS" = "200" ] && EXPECTED_DATABASE_STATE="$EXPECTED_DATABASE_STATE" node - "$BODY_FILE" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = body.status === 'ready' && body.checks?.database === process.env.EXPECTED_DATABASE_STATE;
          console.log(JSON.stringify({
            status: body.status,
            database: body.checks?.database,
            environment: body.environment,
          }));
          process.exit(valid ? 0 : 1);
          NODE
            then
              rm -f "$BODY_FILE"
              exit 0
            fi
            rm -f "$BODY_FILE"
            sleep $((attempt * 5))
          done
          echo "Rollback readiness did not become healthy."
          exit 1

      - name: Restore D1 binding and enabled feature flag
        run: cp "$RUNNER_TEMP/wrangler-d1-enabled.jsonc" apps/edge-api/wrangler.jsonc

      - name: Deploy restored D1 configuration
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Confirm restored D1 readiness
        env:
          EXPECTED_DATABASE_STATE: ready
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            BODY_FILE="$(mktemp)"
            STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "$STAGING_URL/ready" || true)"
            if [ "$STATUS" = "200" ] && EXPECTED_DATABASE_STATE="$EXPECTED_DATABASE_STATE" node - "$BODY_FILE" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = body.status === 'ready' && body.checks?.database === process.env.EXPECTED_DATABASE_STATE;
          console.log(JSON.stringify({
            status: body.status,
            database: body.checks?.database,
            environment: body.environment,
            database_latency_ms: body.database_latency_ms,
          }));
          process.exit(valid ? 0 : 1);
          NODE
            then
              rm -f "$BODY_FILE"
              exit 0
            fi
            rm -f "$BODY_FILE"
            sleep $((attempt * 5))
          done
          echo "Restored D1 readiness did not become healthy."
          exit 1
