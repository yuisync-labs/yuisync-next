name: Edge staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke test staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require scoped Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci
      - run: npm run edge:check

      - name: Deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: apps/edge-api
          command: deploy --env staging

      - name: Smoke test deployed Worker
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run edge:smoke -- "$EDGE_STAGING_URL"

      - name: Record deployment summary
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Edge staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${EDGE_STAGING_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health, readiness and sanitized 404: passed" >> "$GITHUB_STEP_SUMMARY"
