name: Edge staging deploy

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy and smoke test staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'architecture' &&
        github.event.pull_request.base.ref == 'architecture/cloudflare-foundation' &&
        startsWith(github.event.pull_request.head.ref, 'phase/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: cloudflare-staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require scoped Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci

      - name: Require complete Edge frontend compatibility
        run: npm run check:edge-compat-surface -- --strict

      - run: npm run edge:check

      - name: Apply main D1 staging migrations
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Apply Better Auth D1 staging migrations
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply AUTH_DB --env staging --remote

      - name: Verify D1 schema version 20
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESULT="$(npx wrangler d1 execute DB --env staging --remote --json --command "SELECT value FROM _yuisync_system_metadata WHERE key = 'schema_version';")"
          node -e "const r=JSON.parse(process.argv[1]);const rows=r?.[0]?.results||r?.results||[];if(String(rows[0]?.value)!=='20')throw new Error('Staging D1 schema is not version 20');" "$RESULT"

      - name: Verify Better Auth core schema
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESULT="$(npx wrangler d1 execute AUTH_DB --env staging --remote --json --command "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('user','session','account','verification') ORDER BY name;")"
          node -e "const r=JSON.parse(process.argv[1]);const rows=r?.[0]?.results||r?.results||[];const a=rows.map(x=>x.name).sort().join(',');if(a!=='account,session,user,verification')throw new Error('AUTH_DB core schema is incomplete');" "$RESULT"

      - name: Deploy staging Worker and SPA assets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: apps/edge-api
          command: deploy --env staging

      - name: Smoke test deployed Worker
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run edge:smoke -- "$EDGE_STAGING_URL"

      - name: Confirm SPA is served from the Worker
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          curl --silent --show-error --dump-header "$HEADERS" --output "$BODY" "$EDGE_STAGING_URL/"
          grep -Eiq '^content-type:.*text/html' "$HEADERS"
          grep -qi '<div id="root"' "$BODY"
          rm -f "$HEADERS" "$BODY"

      - name: Confirm D1, auth and coordination readiness
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "$EDGE_STAGING_URL/ready")"
          test "$STATUS" = "200"
          node - "$BODY_FILE" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.status !== 'ready' || body.checks?.database !== 'ready' || body.checks?.schema_version !== '20' || body.checks?.coordination !== 'ready' || body.checks?.auth_database !== 'configured') {
            throw new Error('Staging readiness is not healthy after deployment.');
          }
          console.log(JSON.stringify({status:body.status,database:body.checks.database,schema:body.checks.schema_version,auth_database:body.checks.auth_database,coordination:body.checks.coordination,environment:body.environment}));
          NODE
          rm -f "$BODY_FILE"

      - name: Record deployment summary
        env:
          EDGE_STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "## Edge staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${DEPLOYED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${EDGE_STAGING_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main D1 schema: v20" >> "$GITHUB_STEP_SUMMARY"
          echo "- Better Auth D1: migrated" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI Lab D1: migrated" >> "$GITHUB_STEP_SUMMARY"
          echo "- SPA assets: served by Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durable Object binding readiness: passed" >> "$GITHUB_STEP_SUMMARY"
