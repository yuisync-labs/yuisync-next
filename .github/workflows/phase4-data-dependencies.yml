name: Phase 4 D1 dependency cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase4-d1-dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'phase/04-data-access-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Remove PostgreSQL-only dependencies
        run: |
          npm uninstall --workspace @yuisync/edge-api pg
          npm uninstall --workspace @yuisync/edge-api --save-dev @types/pg

      - name: Restore complete workspace
        run: npm ci

      - name: Validate D1 foundation and legacy gates
        run: |
          npm run audit:ci
          npm run edge:check
          npm run typecheck
          npm run typecheck:contracts
          npm run check:contract-boundaries

      - name: Commit generated dependency metadata
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/edge-api/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "D1 dependency metadata already up to date."
            exit 0
          fi
          git commit -m "build: remove PostgreSQL-only Edge dependencies"
          git push origin "HEAD:${BRANCH_NAME}"
