name: Phase 4 dependency verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run edge:check
      - run: npm run typecheck
      - run: npm run typecheck:contracts
      - run: npm run check:contract-boundaries
