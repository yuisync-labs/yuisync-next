name: Luna Agents SDK lockfile
on:
  push:
    branches: [codex/luna-operational-foundation]
    paths:
      - apps/edge-api/package.json
      - .github/workflows/luna-agents-lockfile.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'yuisync-labs/yuisync-next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile lockfile with audited manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(luna): regenerate Agents SDK dependency lockfile'
          git push origin HEAD:codex/luna-operational-foundation
