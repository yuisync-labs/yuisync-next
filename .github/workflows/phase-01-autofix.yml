name: Phase 1 autofix

on:
  push:
    branches:
      - phase/01-safety-net
    paths:
      - .github/workflows/phase-01-autofix.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-safety-net
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fix tenant transport precedence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/lib/petbotAgent.js')
          content = path.read_text()
          old = """  const defaultIds = new Set(defaults.map((option) => option.id))
          const configuredById = new Map(configured.map((option) => [clean(option?.id || option?.mode), option]))
          const source = [
            ...defaults.map((option) => ({ ...option, ...(configuredById.get(option.id) || {}) })),
            ...configured.filter((option) => !defaultIds.has(clean(option?.id || option?.mode))),
          ]
          """
          new = """  // An explicit tenant list is authoritative. Defaults are only a fallback
          // when the store has not configured any transport option.
          const source = configured.length ? configured : defaults
          """
          if content.count(old) != 1:
              raise SystemExit('expected transport normalization block was not found exactly once')
          path.write_text(content.replace(old, new))
          PY

      - name: Pin patched Undici 7.x resolution
        run: |
          npm pkg set 'overrides.undici=7.29.0'
          npm install --package-lock-only --ignore-scripts

      - name: Validate fixes
        run: |
          npm ci
          npm run audit:ci
          npm run test:petbot

      - name: Commit validated fixes
        run: |
          rm .github/workflows/phase-01-autofix.yml
          git config user.name 'yuisync-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add server/lib/petbotAgent.js package.json package-lock.json .github/workflows/phase-01-autofix.yml
          git commit -m 'fix: stabilize transport config and dependency audit'
          git push origin HEAD:phase/01-safety-net
