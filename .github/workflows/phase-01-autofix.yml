name: Phase 1 autofix

on:
  push:
    branches:
      - phase/01-safety-net
    paths:
      - .github/workflows/phase-01-autofix.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/01-safety-net
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fix tenant transport precedence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('server/lib/petbotAgent.js')
          content = path.read_text()
          pattern = re.compile(
              r"  const defaultIds = new Set\(defaults\.map\(\(option\) => option\.id\)\)\n"
              r"  const configuredById = .*?\n"
              r"  const source = \[\n"
              r".*?"
              r"  \]\n"
              r"(?=  return source)",
              re.DOTALL,
          )
          replacement = (
              "  // An explicit tenant list is authoritative. Defaults are only a fallback\n"
              "  // when the store has not configured any transport option.\n"
              "  const source = configured.length ? configured : defaults\n"
          )
          updated, count = pattern.subn(replacement, content)
          if count != 1:
              raise SystemExit(f'expected one transport normalization block, found {count}')
          path.write_text(updated)
          PY

      - name: Pin patched Undici 7.x resolution
        run: |
          npm pkg set 'overrides.undici=7.29.0'
          npm install --package-lock-only --ignore-scripts

      - name: Validate fixes
        run: |
          npm ci
          npm run audit:ci
          npm run test:petbot

      - name: Commit validated fixes
        run: |
          rm .github/workflows/phase-01-autofix.yml
          git config user.name 'yuisync-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add server/lib/petbotAgent.js package.json package-lock.json .github/workflows/phase-01-autofix.yml
          git commit -m 'fix: stabilize transport config and dependency audit'
          git push origin HEAD:phase/01-safety-net
