name: Production final deploy v2

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: yuisync-production-final-v2
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.label.name == 'production-final-v2-authorized'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gates.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'

          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const body = String(event?.issue?.body || '')
          const release = /^Release-SHA:\s*([0-9a-f]{40})\s*$/im.exec(body)?.[1]?.toLowerCase()
          const auth = /^Authorization:\s*(\S+)\s*$/im.exec(body)?.[1]
          const domain = /^Domain:\s*(\S+)\s*$/im.exec(body)?.[1]?.toLowerCase()
          if (!release) throw new Error('RELEASE_SHA_REQUIRED')
          if (auth !== 'AUTHORIZE_PRODUCTION_FINAL_V2') throw new Error('AUTHORIZATION_REQUIRED')
          if (domain !== 'yuisync.app') throw new Error('DOMAIN_INVALID')

          execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' })
          const currentMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim().toLowerCase()
          if (release !== currentMain) throw new Error(`RELEASE_NOT_CURRENT_MAIN:${release}:${currentMain}`)

          const repo = process.env.GITHUB_REPOSITORY
          const listSuccessfulRuns = (workflow) => {
            const endpoint = `repos/${repo}/actions/workflows/${workflow}/runs?status=success&per_page=30`
            const output = execFileSync(
              'gh',
              ['api', endpoint, '--jq', '.workflow_runs[] | [.head_sha, (.id|tostring), .conclusion] | @tsv'],
              { encoding: 'utf8', env: process.env, maxBuffer: 1024 * 1024 },
            ).trim()
            if (!output) return []
            return output.split('\n').map((line) => {
              const [sha, id, conclusion] = line.split('\t')
              return { sha: String(sha || '').toLowerCase(), id: Number(id), conclusion }
            })
          }

          const resolveProof = (workflow, kind) => {
            const exact = listSuccessfulRuns(workflow).find((run) => run.sha === release && run.conclusion === 'success')
            return exact ? { kind, mode: 'exact', sha: release, run_id: exact.id } : null
          }

          const qualityProof = resolveProof('quality.yml', 'quality')
          const stagingProof = resolveProof('full-staging-certification.yml', 'staging')
          if (!qualityProof) throw new Error('QUALITY_REQUIRED')
          if (!stagingProof) throw new Error('STAGING_CERTIFICATION_REQUIRED')

          await appendFile(process.env.GITHUB_OUTPUT, `release_sha=${release}\n`)
          console.log(JSON.stringify({ release_sha: release, quality_proof: qualityProof, staging_proof: stagingProof }))
          NODE

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - run: npm ci

      - name: Require exact release and build deployable SPA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm run build

      - name: Resolve production resources
        run: |
          node scripts/migration/production-dns.mjs inspect
          node scripts/migration/production-cloudflare.mjs resolve
          node scripts/migration/production-domain.mjs workers-url

      - name: Stamp exact release SHA into production config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = String(process.env.YUISYNC_PRODUCTION_WRANGLER_CONFIG || '')
          if (!path) throw new Error('PRODUCTION_WRANGLER_CONFIG_REQUIRED')
          const config = JSON.parse(await readFile(path, 'utf8'))
          config.env ??= {}
          config.env.production ??= {}
          config.env.production.vars ??= {}
          config.env.production.vars.RELEASE_SHA = process.env.RELEASE_SHA
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`, 'utf8')
          NODE

      - name: Prove production prerequisites and migration starting point
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          SECRETS="$(npx wrangler secret list --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --format json)"
          VERSION="$(npx wrangler d1 execute DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          AUTH="$(npx wrangler d1 execute AUTH_DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('user','session','account','verification') ORDER BY name;")"
          export SECRETS VERSION AUTH
          node --input-type=module <<'NODE'
          const flat = (s) => { const p = JSON.parse(s); return (Array.isArray(p) ? p : [p]).flatMap((e) => Array.isArray(e?.results) ? e.results : []) }
          const secrets = JSON.parse(process.env.SECRETS || '[]')
          const version = Number(flat(process.env.VERSION)[0]?.value ?? NaN)
          const auth = flat(process.env.AUTH).map((r) => String(r.name)).sort().join(',')
          if (!secrets.some((r) => r?.name === 'BETTER_AUTH_SECRET')) throw new Error('BETTER_AUTH_SECRET_REQUIRED')
          if (!Number.isInteger(version) || version < 25 || version > 30) throw new Error(`SCHEMA_VERSION_UNSUPPORTED:${version}`)
          if (auth !== 'account,session,user,verification') throw new Error(`AUTH_SCHEMA_INVALID:${auth}`)
          NODE

      - name: Capture production D1 rollback bookmarks
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.artifacts/production-release
          npx wrangler d1 time-travel info DB --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json > ../../.artifacts/production-release/db-before-migration.json
          npx wrangler d1 time-travel info AUTH_DB --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json > ../../.artifacts/production-release/auth-db-before-migration.json

      - name: Apply production D1 migrations
        id: migrate
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
          npx wrangler d1 migrations apply AUTH_DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"

      - name: Prove production schema v30
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npx wrangler d1 execute DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          export VERSION
          node --input-type=module <<'NODE'
          const p = JSON.parse(process.env.VERSION || '[]')
          const rows = (Array.isArray(p) ? p : [p]).flatMap((e) => Array.isArray(e?.results) ? e.results : [])
          const version = String(rows[0]?.value ?? '')
          if (version !== '30') throw new Error(`SCHEMA_VERSION_INVALID_AFTER_MIGRATION:${version}`)
          NODE

      - name: Upload production rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-evidence-${{ env.RELEASE_SHA }}
          path: .artifacts/production-release/
          if-no-files-found: error
          retention-days: 30

      - name: Attach custom domain configuration
        run: YUISYNC_PRODUCTION_ATTACH_DOMAIN=true node scripts/migration/production-cloudflare.mjs resolve

      - name: Re-stamp SHA after production config regeneration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = String(process.env.YUISYNC_PRODUCTION_WRANGLER_CONFIG || '')
          if (!path) throw new Error('PRODUCTION_WRANGLER_CONFIG_REQUIRED')
          const config = JSON.parse(await readFile(path, 'utf8'))
          config.env ??= {}
          config.env.production ??= {}
          config.env.production.vars ??= {}
          config.env.production.vars.RELEASE_SHA = process.env.RELEASE_SHA
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`, 'utf8')
          NODE

      - name: Deploy exact certified runtime
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"

      - name: Wait for live health, readiness and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 18); do
            hs="$(curl --silent --show-error --max-time 10 -o /tmp/h.json -w '%{http_code}' https://yuisync.app/health || true)"
            rs="$(curl --silent --show-error --max-time 10 -o /tmp/r.json -w '%{http_code}' https://yuisync.app/ready || true)"
            vs="$(curl --silent --show-error --max-time 10 -o /tmp/v.json -w '%{http_code}' https://yuisync.app/release || true)"
            if [ "$hs" = 200 ] && [ "$rs" = 200 ] && [ "$vs" = 200 ] && node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const h = JSON.parse(await readFile('/tmp/h.json', 'utf8'))
          const r = JSON.parse(await readFile('/tmp/r.json', 'utf8'))
          const v = JSON.parse(await readFile('/tmp/v.json', 'utf8'))
          const ok = h?.status === 'ok'
            && h?.environment === 'production'
            && r?.status === 'ready'
            && r?.environment === 'production'
            && r?.checks?.database === 'ready'
            && String(r?.checks?.schema_version) === '30'
            && r?.checks?.auth_database === 'configured'
            && r?.checks?.better_auth === 'enabled'
            && String(v?.release_sha || '').toLowerCase() === String(process.env.RELEASE_SHA || '').toLowerCase()
          if (!ok) process.exit(1)
          NODE
            then matched=true; break; fi
            sleep 5
          done
          [ "$matched" = true ] || { echo 'Exact production release SHA was not observed'; cat /tmp/v.json || true; exit 1; }
          curl --fail --silent --show-error https://yuisync.app/ > /dev/null

      - name: Preserve v30 state for explicit recovery decision
        if: failure() && steps.migrate.outcome == 'success'
        run: |
          echo '::warning::Production D1 reached the v30 migration path. Automatic restore remains disabled; use the captured Time Travel bookmarks only after an explicit recovery decision.'

      - name: Release summary
        if: success()
        run: |
          echo '### YuiSync Next certified production promotion' >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 schema: v30' >> "$GITHUB_STEP_SUMMARY"
          echo '- pre-migration D1 + AUTH_DB bookmarks: archived' >> "$GITHUB_STEP_SUMMARY"
          echo '- yuisync.app /health + /ready: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- yuisync.app /release: exact authorized SHA passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Quality + full staging certification: exact release SHA required' >> "$GITHUB_STEP_SUMMARY"
