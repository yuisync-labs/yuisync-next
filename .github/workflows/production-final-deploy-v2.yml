name: Production final deploy v2

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: yuisync-production-final-v2
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.label.name == 'production-final-v2-authorized'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gates.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8'))
          const body=String(event?.issue?.body||'')
          const release=/^Release-SHA:\s*([0-9a-f]{40})\s*$/im.exec(body)?.[1]?.toLowerCase()
          const auth=/^Authorization:\s*(\S+)\s*$/im.exec(body)?.[1]
          const domain=/^Domain:\s*(\S+)\s*$/im.exec(body)?.[1]?.toLowerCase()
          if(!release) throw new Error('RELEASE_SHA_REQUIRED')
          if(auth!=='AUTHORIZE_PRODUCTION_FINAL_V2') throw new Error('AUTHORIZATION_REQUIRED')
          if(domain!=='yuisync.app') throw new Error('DOMAIN_INVALID')
          execFileSync('git',['fetch','origin','main'],{stdio:'inherit'})
          const currentMain=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim().toLowerCase()
          if(release!==currentMain) throw new Error(`RELEASE_NOT_CURRENT_MAIN:${release}:${currentMain}`)
          const repo=process.env.GITHUB_REPOSITORY
          const runs=(wf)=>JSON.parse(execFileSync('gh',['api',`repos/${repo}/actions/workflows/${wf}/runs`,'-f',`head_sha=${release}`,'-f','status=success','-f','per_page=100','-X','GET'],{encoding:'utf8',env:process.env})).workflow_runs||[]
          const q=runs('quality.yml').filter(r=>r.head_sha===release&&r.conclusion==='success')
          const c=runs('full-staging-certification.yml').filter(r=>r.head_sha===release&&r.conclusion==='success')
          if(!q.length) throw new Error('QUALITY_REQUIRED')
          if(c.length<2) throw new Error(`DOUBLE_CERT_REQUIRED:${c.length}`)
          await appendFile(process.env.GITHUB_OUTPUT,`release_sha=${release}\n`)
          console.log(JSON.stringify({release_sha:release,quality:q.length,staging_certifications:c.length}))
          NODE

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Require exact release and revalidate runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm run check:no-runtime-supabase
          npm run check:edge-compat-surface -- --strict
          npm run edge:check
          npm run build
      - name: Resolve production resources
        run: |
          node scripts/migration/production-dns.mjs inspect
          node scripts/migration/production-cloudflare.mjs resolve
          node scripts/migration/production-domain.mjs workers-url
      - name: Prove production prerequisites and migration starting point
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          SECRETS="$(npx wrangler secret list --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --format json)"
          VERSION="$(npx wrangler d1 execute DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          AUTH="$(npx wrangler d1 execute AUTH_DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('user','session','account','verification') ORDER BY name;")"
          export SECRETS VERSION AUTH
          node --input-type=module <<'NODE'
          const flat=(s)=>{const p=JSON.parse(s);return (Array.isArray(p)?p:[p]).flatMap(e=>Array.isArray(e?.results)?e.results:[])}
          const secrets=JSON.parse(process.env.SECRETS||'[]')
          const version=Number(flat(process.env.VERSION)[0]?.value??NaN)
          const auth=flat(process.env.AUTH).map(r=>String(r.name)).sort().join(',')
          if(!secrets.some(r=>r?.name==='BETTER_AUTH_SECRET')) throw new Error('BETTER_AUTH_SECRET_REQUIRED')
          if(!Number.isInteger(version)||version<25||version>30) throw new Error(`SCHEMA_VERSION_UNSUPPORTED:${version}`)
          if(auth!=='account,session,user,verification') throw new Error(`AUTH_SCHEMA_INVALID:${auth}`)
          console.log(JSON.stringify({status:'production-prerequisites-ready',schema_version:version,better_auth_secret:true}))
          NODE
      - name: Capture production D1 rollback bookmarks
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.artifacts/production-release
          npx wrangler d1 time-travel info DB --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json > ../../.artifacts/production-release/db-before-migration.json
          npx wrangler d1 time-travel info AUTH_DB --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json > ../../.artifacts/production-release/auth-db-before-migration.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const evidence={
            schema:'yuisync-production-migration-evidence/v1',
            release_sha:process.env.RELEASE_SHA,
            captured_at:new Date().toISOString(),
            db:JSON.parse(await readFile('../../.artifacts/production-release/db-before-migration.json','utf8')),
            auth_db:JSON.parse(await readFile('../../.artifacts/production-release/auth-db-before-migration.json','utf8')),
          }
          await writeFile('../../.artifacts/production-release/migration-evidence.json',`${JSON.stringify(evidence,null,2)}\n`)
          NODE
      - name: Apply production D1 migrations through v30
        id: migrate
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
          npx wrangler d1 migrations apply AUTH_DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
      - name: Prove production schema v30 after migration
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npx wrangler d1 execute DB --env production --remote --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG" --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          export VERSION
          node --input-type=module <<'NODE'
          const p=JSON.parse(process.env.VERSION||'[]')
          const rows=(Array.isArray(p)?p:[p]).flatMap(e=>Array.isArray(e?.results)?e.results:[])
          const version=String(rows[0]?.value??'')
          if(version!=='30') throw new Error(`SCHEMA_VERSION_INVALID_AFTER_MIGRATION:${version}`)
          console.log(JSON.stringify({status:'production-schema-ready',schema_version:version}))
          NODE
      - name: Upload production migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-evidence-${{ env.RELEASE_SHA }}
          path: .artifacts/production-release/
          if-no-files-found: error
          retention-days: 30
      - name: Attach custom domain configuration
        run: YUISYNC_PRODUCTION_ATTACH_DOMAIN=true node scripts/migration/production-cloudflare.mjs resolve
      - name: Deploy exact certified runtime
        id: deploy
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npx wrangler deploy --env production --config "$YUISYNC_PRODUCTION_WRANGLER_CONFIG"; then
              exit 0
            fi
            [ "$attempt" = 2 ] && exit 1
            sleep 5
          done
      - name: Wait for new version on custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            hs="$(curl --silent --show-error --max-time 20 -o /tmp/h.json -w '%{http_code}' https://yuisync.app/health || true)"
            rs="$(curl --silent --show-error --max-time 20 -o /tmp/r.json -w '%{http_code}' https://yuisync.app/ready || true)"
            echo "attempt=$attempt health=$hs ready=$rs"
            if [ "$hs" = 200 ] && [ "$rs" = 200 ]; then
              if node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises'
          const h=JSON.parse(await readFile('/tmp/h.json','utf8'))
          const r=JSON.parse(await readFile('/tmp/r.json','utf8'))
          const ok=h?.status==='ok'&&h?.environment==='production'&&r?.status==='ready'&&r?.environment==='production'&&r?.checks?.database==='ready'&&String(r?.checks?.schema_version)==='30'&&r?.checks?.auth_database==='configured'&&r?.checks?.coordination==='ready'&&r?.checks?.better_auth==='enabled'&&r?.checks?.migration_capabilities==='closed'&&r?.checks?.schema_capabilities==='ready'
          if(!ok) process.exit(1)
          NODE
              then echo 'new-version-ready'; break; fi
            fi
            if [ "$attempt" = 30 ]; then
              echo 'health-body:'; cat /tmp/h.json || true; echo
              echo 'ready-body:'; cat /tmp/r.json || true; echo
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error https://yuisync.app/ > /dev/null
      - name: Prepare ephemeral production Better Auth user
        id: fixture
        env:
          YUISYNC_E2E_WRANGLER_ENV: production
        run: |
          export YUISYNC_E2E_BASE_URL=https://yuisync.app
          export YUISYNC_E2E_WRANGLER_CONFIG="$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
          node scripts/migration/staging-e2e-fixtures.mjs setup
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated production E2E
        run: |
          export YUISYNC_E2E_BASE_URL=https://yuisync.app
          npx playwright test test/e2e/authenticated-tabs.spec.js --project=desktop --workers=1 --timeout=180000
      - name: Clean ephemeral production user
        if: always() && steps.fixture.outcome == 'success'
        env:
          YUISYNC_E2E_WRANGLER_ENV: production
        run: |
          export YUISYNC_E2E_BASE_URL=https://yuisync.app
          export YUISYNC_E2E_WRANGLER_CONFIG="$YUISYNC_PRODUCTION_WRANGLER_CONFIG"
          node scripts/migration/staging-e2e-fixtures.mjs cleanup
      - name: Preserve v30 state for explicit recovery decision
        if: failure() && steps.migrate.outcome == 'success'
        run: |
          echo '::warning::Production D1 reached the v30 migration path. Automatic D1 Time Travel restore is intentionally disabled because restore overwrites the database in place. Use the uploaded pre-migration bookmarks only after an explicit recovery decision.'
          echo '::warning::Do not roll the Worker back independently to a schema-v25 readiness contract after the database has reached v30.'
      - name: Release summary
        if: success()
        run: |
          echo '### YuiSync Next production' >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 schema: v30' >> "$GITHUB_STEP_SUMMARY"
          echo '- pre-migration D1 + AUTH_DB bookmarks: archived' >> "$GITHUB_STEP_SUMMARY"
          echo '- yuisync.app /health + /ready: passed after propagation' >> "$GITHUB_STEP_SUMMARY"
          echo '- authenticated production E2E: passed' >> "$GITHUB_STEP_SUMMARY"
