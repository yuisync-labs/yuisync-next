name: Phase 6 coordination staging canary

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-staging-deployment
  queue: max
  cancel-in-progress: false

jobs:
  canary:
    name: Provision, test and restore Durable Object staging
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'coordination-canary' &&
      github.event.pull_request.base.ref == 'architecture/cloudflare-foundation' &&
      github.event.pull_request.head.ref == 'phase/06-durable-coordination' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: cloudflare-staging
      url: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    env:
      EDGE_STAGING_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require scoped Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci
      - run: npm run edge:check

      - name: Generate ephemeral canary identity and rollback configuration
        working-directory: apps/edge-api
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          PROBE_ID="phase06-$(node -e "console.log(crypto.randomUUID())")"
          echo "::add-mask::$TOKEN"
          echo "COORDINATION_CANARY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "COORDINATION_PROBE_ID=$PROBE_ID" >> "$GITHUB_ENV"

          node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const rollback = structuredClone(base);
          rollback.env.staging.vars.EDGE_COORDINATION_ENABLED = 'false';
          delete rollback.env.staging.durable_objects;
          fs.writeFileSync(
            'wrangler.phase06-rollback.jsonc',
            `${JSON.stringify(rollback, null, 2)}\n`,
          );
          NODE

      - name: Deploy exact staging coordination configuration
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            LOG_FILE="$(mktemp)"
            set +e
            npx wrangler deploy \
              --config wrangler.jsonc \
              --env staging \
              --message "PR7 Durable Object canary" 2>&1 | tee "$LOG_FILE"
            STATUS=${PIPESTATUS[0]}
            set -e

            if [[ "$STATUS" -eq 0 ]]; then
              rm -f "$LOG_FILE"
              exit 0
            fi

            if ! grep -Eq \
              '503 Service Unavailable|upstream connect error|connection termination|malformed response from the API' \
              "$LOG_FILE"; then
              rm -f "$LOG_FILE"
              exit "$STATUS"
            fi

            rm -f "$LOG_FILE"
            if [[ "$attempt" -eq 3 ]]; then
              exit "$STATUS"
            fi
            sleep $((attempt * 5))
          done

      - name: Smoke test staging after provisioning
        run: npm run edge:smoke -- "$EDGE_STAGING_URL"

      - name: Upload ephemeral canary secret
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf '{"EDGE_COORDINATION_CANARY_TOKEN":"%s"}\n' \
            "$COORDINATION_CANARY_TOKEN" \
            | npx wrangler secret bulk --env staging

      - name: Run authenticated concurrent canary
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.EDGE_STAGING_URL;
          const token = process.env.COORDINATION_CANARY_TOKEN;
          const probeId = process.env.COORDINATION_PROBE_ID;
          let lastStatus = 0;
          let lastBody = null;

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${url}/_internal/coordination/canary`, {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${token}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ probe_id: probeId }),
              });
              lastStatus = response.status;
              lastBody = await response.json();
              if (response.status === 200 && lastBody?.status === 'passed') break;
            } catch {
              lastStatus = 0;
              lastBody = null;
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          if (
            lastStatus !== 200 ||
            lastBody?.status !== 'passed' ||
            lastBody?.claims?.claimed !== 1 ||
            lastBody?.claims?.busy !== 1 ||
            lastBody?.completion !== 'completed' ||
            lastBody?.duplicate_status !== 'succeeded' ||
            !Number.isSafeInteger(lastBody?.fencing_token)
          ) {
            throw new Error('Durable Object concurrent canary failed.');
          }

          console.log(JSON.stringify({
            status: lastBody.status,
            claims: lastBody.claims,
            completion: lastBody.completion,
            duplicate_status: lastBody.duplicate_status,
            fencing_token: lastBody.fencing_token,
          }));
          NODE

      - name: Deploy logical rollback without binding
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            LOG_FILE="$(mktemp)"
            set +e
            npx wrangler deploy \
              --config wrangler.phase06-rollback.jsonc \
              --env staging \
              --message "PR7 Durable Object logical rollback" 2>&1 | tee "$LOG_FILE"
            STATUS=${PIPESTATUS[0]}
            set -e

            if [[ "$STATUS" -eq 0 ]]; then
              rm -f "$LOG_FILE"
              exit 0
            fi

            if ! grep -Eq \
              '503 Service Unavailable|upstream connect error|connection termination|malformed response from the API' \
              "$LOG_FILE"; then
              rm -f "$LOG_FILE"
              exit "$STATUS"
            fi

            rm -f "$LOG_FILE"
            if [[ "$attempt" -eq 3 ]]; then
              exit "$STATUS"
            fi
            sleep $((attempt * 5))
          done

      - name: Confirm coordination is disabled after rollback
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.EDGE_STAGING_URL;
          let observed = null;

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${url}/ready`, { cache: 'no-store' });
              const body = await response.json();
              if (
                response.status === 200 &&
                body?.status === 'ready' &&
                body?.checks?.database === 'ready' &&
                body?.checks?.coordination === 'disabled'
              ) {
                observed = body;
                break;
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          if (!observed) throw new Error('Coordination rollback was not observed.');
          console.log(JSON.stringify({
            status: observed.status,
            database: observed.checks.database,
            coordination: observed.checks.coordination,
          }));
          NODE

      - name: Restore standard staging configuration
        if: always()
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            LOG_FILE="$(mktemp)"
            set +e
            npx wrangler deploy \
              --config wrangler.jsonc \
              --env staging \
              --message "PR7 restore Durable Object staging" 2>&1 | tee "$LOG_FILE"
            STATUS=${PIPESTATUS[0]}
            set -e

            if [[ "$STATUS" -eq 0 ]]; then
              rm -f "$LOG_FILE"
              exit 0
            fi

            if ! grep -Eq \
              '503 Service Unavailable|upstream connect error|connection termination|malformed response from the API' \
              "$LOG_FILE"; then
              rm -f "$LOG_FILE"
              exit "$STATUS"
            fi

            rm -f "$LOG_FILE"
            if [[ "$attempt" -eq 3 ]]; then
              exit "$STATUS"
            fi
            sleep $((attempt * 5))
          done

      - name: Delete ephemeral canary secret
        if: always()
        working-directory: apps/edge-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf '{"EDGE_COORDINATION_CANARY_TOKEN":null}\n' \
            | npx wrangler secret bulk --env staging

      - name: Confirm staging restored and canary hidden
        if: always()
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.EDGE_STAGING_URL;
          let restored = null;

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${url}/ready`, { cache: 'no-store' });
              const body = await response.json();
              if (
                response.status === 200 &&
                body?.status === 'ready' &&
                body?.checks?.database === 'ready' &&
                body?.checks?.coordination === 'ready'
              ) {
                restored = body;
                break;
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          if (!restored) throw new Error('Staging coordination was not restored.');

          const hiddenResponse = await fetch(`${url}/_internal/coordination/canary`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ probe_id: 'phase06-hidden-check' }),
          });
          if (hiddenResponse.status !== 404) {
            throw new Error('Canary route remained accessible without the ephemeral secret.');
          }

          console.log(JSON.stringify({
            status: restored.status,
            database: restored.checks.database,
            coordination: restored.checks.coordination,
            unauthenticated_canary_status: hiddenResponse.status,
          }));
          NODE

      - name: Record operation summary
        if: success()
        run: |
          echo "## Durable Object staging gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Namespace storage: SQLite via declarative exports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Concurrent claim serialization: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completion and idempotency: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Logical rollback: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standard staging configuration: restored" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ephemeral canary secret: removed" >> "$GITHUB_STEP_SUMMARY"
