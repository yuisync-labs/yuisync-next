name: Delivery1 branch patch

on:
  push:
    branches:
      - codex/tenant-settings-receipts

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/tenant-settings-receipts
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align guarded patch with current sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-delivery1-receipt-patch.mjs')
          text = path.read_text()

          agenda_old = """  text = replaceCount(text,
              'writeAndPrint(receiptShell({ storeSettings, title, content }))',
              'openReceiptPreview({ storeSettings, title, bodyHtml: content })',
              2,
              'AgendaResolved preview calls')"""
          agenda_new = """  text = replaceOnce(text,
              'writeAndPrint(receiptShell({ storeSettings, title, content }))',
              'openReceiptPreview({ storeSettings, title, bodyHtml: content })',
              'AgendaResolved single preview call')
            text = replaceOnce(text,
              \"writeAndPrint(receiptShell({ storeSettings, title: 'AGENDA DO DIA', content }))\",
              \"openReceiptPreview({ storeSettings, title: 'AGENDA DO DIA', bodyHtml: content })\",
              'AgendaResolved day preview call')"""
          if text.count(agenda_old) != 1:
              raise SystemExit('Agenda patch alignment source not found exactly once')
          text = text.replace(agenda_old, agenda_new)

          commission_old = r"/  function printHistory\(\) \{[\s\S]*?\n  \}\n$/"
          commission_new = r"/  function printHistory\(\) \{[\s\S]*?\n  \}/"
          if text.count(commission_old) != 1:
              raise SystemExit('Commission patch alignment source not found exactly once')
          text = text.replace(commission_old, commission_new)

          path.write_text(text)
          PY

      - name: Apply guarded patch
        run: node scripts/apply-delivery1-receipt-patch.mjs

      - name: Validate focused receipt tests
        run: |
          cat > vitest.delivery1.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config'
          export default defineConfig({
            test: {
              environment: 'node',
              include: [
                'test/agendaPrintCleanup.test.mjs',
                'test/tenantReceiptSettingsStatic.test.mjs',
                'test/receiptPrintContract.test.mjs',
              ],
            },
          })
          EOF
          npx vitest run --config vitest.delivery1.config.mjs

      - name: Validate build
        run: npm run build

      - name: Commit migrated active flows
        run: |
          rm -f .github/workflows/delivery1-branch-patch.yml scripts/apply-delivery1-receipt-patch.mjs vitest.delivery1.config.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(receipts): migrate active print flows" || exit 0
          git push origin HEAD:codex/tenant-settings-receipts
