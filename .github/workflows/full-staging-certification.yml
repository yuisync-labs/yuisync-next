name: Full staging certification

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false

jobs:
  certify:
    name: Certify real Cloudflare staging
    if: >-
      github.event.label.name == 'architecture' &&
      github.event.pull_request.base.ref == 'architecture/cloudflare-foundation' &&
      github.event.pull_request.head.ref == 'phase/08-finalization' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YUISYNC_STAGING_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci

      - name: Require zero frontend compatibility debt
        run: |
          npm run check:no-runtime-supabase
          npm run check:edge-compat-surface -- --strict

      - name: Validate complete Edge runtime
        run: npm run edge:check

      - name: Apply staging D1 migrations
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env staging --remote
          npx wrangler d1 migrations apply AUTH_DB --env staging --remote

      - name: Build SPA for same commit
        run: npm run build

      - name: Deploy same commit to staging
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Prepare ephemeral Better Auth E2E users
        id: e2e-fixtures
        run: node scripts/migration/staging-e2e-fixtures.mjs setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real staging browser E2E
        run: >-
          npx playwright test test/e2e/authenticated-tabs.spec.js
          --project=desktop
          --workers=1
          --timeout=180000

      - name: Clean ephemeral Better Auth E2E users
        if: always()
        run: node scripts/migration/staging-e2e-fixtures.mjs cleanup

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-e2e-${{ github.event.pull_request.head.sha }}
          path: |
            .artifacts/staging-e2e/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Run full remote certification after E2E cleanup
        run: node scripts/migration/run-full-staging-certification.mjs

      - name: Bind certification evidence to deployed SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const certification = JSON.parse(await readFile('.artifacts/staging-certification/certification.json', 'utf8'))
          if (certification?.schema !== 'yuisync-staging-certification/v5' || certification?.status !== 'certified') {
            throw new Error('CERTIFICATION_NOT_CERTIFIED')
          }
          const release = {
            schema: 'yuisync-staging-release-evidence/v1',
            release_sha: process.env.RELEASE_SHA,
            certification_run_id: certification.run_id,
            certification_schema: certification.schema,
          }
          await writeFile('.artifacts/staging-certification/release.json', `${JSON.stringify(release, null, 2)}\n`)
          NODE

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-staging-certification-${{ github.event.pull_request.head.sha }}
          path: .artifacts/staging-certification/
          if-no-files-found: warn
          retention-days: 30

      - name: Certification summary
        if: success()
        run: |
          echo '## Full Cloudflare staging certification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Schema: v5 / runtime schema v21' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required checks: 26/26' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence release SHA: ${{ github.event.pull_request.head.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser E2E: real Worker + Better Auth + admin/manager/member' >> "$GITHUB_STEP_SUMMARY"
          echo '- Better Auth sign-in: real remote probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tenant isolation: real authenticated remote probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Queue: real canary + idempotent rerun' >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 + AUTH_DB rollback bookmarks: captured' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production/cutover: untouched' >> "$GITHUB_STEP_SUMMARY"
