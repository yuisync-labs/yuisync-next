name: Full staging certification

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve exact release SHA
    if: github.event.label.name == 'staging-certification-authorized'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gates.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const body = String(event?.issue?.body || '')
          const release = /^Release-SHA:\s*([0-9a-f]{40})\s*$/im.exec(body)?.[1]?.toLowerCase()
          const auth = /^Authorization:\s*(\S+)\s*$/im.exec(body)?.[1]
          if (!release) throw new Error('RELEASE_SHA_REQUIRED')
          if (auth !== 'AUTHORIZE_STAGING_CERTIFICATION') throw new Error('STAGING_AUTHORIZATION_REQUIRED')
          execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' })
          const currentMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim().toLowerCase()
          if (release !== currentMain) throw new Error(`RELEASE_NOT_CURRENT_MAIN:${release}:${currentMain}`)
          await appendFile(process.env.GITHUB_OUTPUT, `release_sha=${release}\n`)
          console.log(JSON.stringify({ status: 'staging-certification-authorized', release_sha: release }))
          NODE

  certify:
    name: Certify real Cloudflare staging
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      YUISYNC_STAGING_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require exact SHA and Cloudflare staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci

      - name: Validate compatibility and Edge runtime
        run: |
          npm run check:no-runtime-supabase
          npm run check:edge-compat-surface -- --strict
          npm run edge:check

      - name: Capture pre-migration staging D1 bookmarks
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.artifacts/staging-certification
          npx wrangler d1 time-travel info DB --env staging --json > ../../.artifacts/staging-certification/db-before-migration.json
          npx wrangler d1 time-travel info AUTH_DB --env staging --json > ../../.artifacts/staging-certification/auth-db-before-migration.json

      - name: Apply staging D1 migrations through v30
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env staging --remote
          npx wrangler d1 migrations apply AUTH_DB --env staging --remote

      - name: Prove staging schema v30 before deploy
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npx wrangler d1 execute DB --env staging --remote --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          export VERSION
          node --input-type=module <<'NODE'
          const parsed = JSON.parse(process.env.VERSION || '[]')
          const batches = Array.isArray(parsed) ? parsed : [parsed]
          const rows = batches.flatMap((batch) => Array.isArray(batch?.results) ? batch.results : [])
          const version = String(rows[0]?.value ?? '')
          if (version !== '30') throw new Error(`STAGING_SCHEMA_VERSION_INVALID:${version}`)
          console.log(JSON.stringify({ status: 'staging-schema-ready', schema_version: version }))
          NODE

      - name: Build SPA for same commit
        run: npm run build

      - name: Deploy exact release to staging
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Prepare ephemeral Better Auth E2E users
        id: e2e-fixtures
        run: node scripts/migration/staging-e2e-fixtures.mjs setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify authenticated realtime WebSocket
        run: node scripts/migration/staging-realtime-websocket.mjs

      - name: Run real staging browser E2E
        run: >-
          npx playwright test test/e2e/authenticated-tabs.spec.js
          --project=desktop
          --workers=1
          --timeout=180000

      - name: Clean ephemeral Better Auth E2E users
        if: always()
        run: node scripts/migration/staging-e2e-fixtures.mjs cleanup

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-e2e-${{ env.RELEASE_SHA }}
          path: |
            .artifacts/staging-e2e/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Run full remote certification after E2E cleanup
        run: node scripts/migration/run-full-staging-certification-v30.mjs

      - name: Bind certification evidence to deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const certification = JSON.parse(await readFile('.artifacts/staging-certification/certification.json', 'utf8'))
          if (certification?.schema !== 'yuisync-staging-certification/v6' || certification?.status !== 'certified') {
            throw new Error('CERTIFICATION_NOT_CERTIFIED')
          }
          const release = {
            schema: 'yuisync-staging-release-evidence/v2',
            release_sha: process.env.RELEASE_SHA,
            runtime_schema: 30,
            certification_run_id: certification.run_id,
            certification_schema: certification.schema,
          }
          await writeFile('.artifacts/staging-certification/release.json', `${JSON.stringify(release, null, 2)}\n`)
          NODE

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-staging-certification-${{ env.RELEASE_SHA }}
          path: .artifacts/staging-certification/
          if-no-files-found: warn
          retention-days: 30

      - name: Certification summary
        if: success()
        run: |
          echo '## Full Cloudflare staging certification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Certification schema: v6 / runtime schema v30' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required checks: 26/26' >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence release SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser E2E: real Worker + Better Auth + admin/manager/member' >> "$GITHUB_STEP_SUMMARY"
          echo '- Realtime WebSocket: authenticated tenant-scoped mutation invalidation passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Better Auth sign-in: real remote probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tenant isolation: real authenticated remote probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Queue: real canary + idempotent rerun' >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 + AUTH_DB pre-migration bookmarks: captured' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production/cutover: untouched' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish auditable result to authorization issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Staging certification result

          - Release-SHA: \`$RELEASE_SHA\`
          - Runtime schema target: \`30\`
          - Result: **$JOB_STATUS**
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Attempt: \`$GITHUB_RUN_ATTEMPT\`

          This result is staging-only and does not authorize production.
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
