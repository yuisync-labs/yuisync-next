name: Full staging certification

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve exact release SHA
    if: github.event.label.name == 'staging-certification-authorized'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gates.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const body = String(event?.issue?.body || '')
          const release = /^Release-SHA:\s*([0-9a-f]{40})\s*$/im.exec(body)?.[1]?.toLowerCase()
          const auth = /^Authorization:\s*(\S+)\s*$/im.exec(body)?.[1]
          if (!release) throw new Error('RELEASE_SHA_REQUIRED')
          if (auth !== 'AUTHORIZE_STAGING_CERTIFICATION') throw new Error('STAGING_AUTHORIZATION_REQUIRED')
          execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' })
          const currentMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim().toLowerCase()
          if (release !== currentMain) throw new Error(`RELEASE_NOT_CURRENT_MAIN:${release}:${currentMain}`)
          await appendFile(process.env.GITHUB_OUTPUT, `release_sha=${release}\n`)
          console.log(JSON.stringify({ status: 'staging-promotion-authorized', release_sha: release }))
          NODE

      - name: Publish run start to authorization issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RELEASE_SHA: ${{ steps.gates.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Fast staging promotion started\n\n- Release-SHA: \`$RELEASE_SHA\`\n- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nThis run is staging-only."

  certify:
    name: Promote and smoke Cloudflare staging
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      YUISYNC_STAGING_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Require exact SHA and Cloudflare staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci

      - name: Capture pre-migration staging D1 bookmarks
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.artifacts/staging-certification
          npx wrangler d1 time-travel info DB --env staging --json > ../../.artifacts/staging-certification/db-before-migration.json
          npx wrangler d1 time-travel info AUTH_DB --env staging --json > ../../.artifacts/staging-certification/auth-db-before-migration.json

      - name: Apply staging D1 migrations
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env staging --remote
          npx wrangler d1 migrations apply AUTH_DB --env staging --remote

      - name: Prove staging schema v30
        working-directory: apps/edge-api
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(npx wrangler d1 execute DB --env staging --remote --json --command "SELECT value FROM _yuisync_system_metadata WHERE key='schema_version';")"
          export VERSION
          node --input-type=module <<'NODE'
          const parsed = JSON.parse(process.env.VERSION || '[]')
          const rows = (Array.isArray(parsed) ? parsed : [parsed]).flatMap((batch) => Array.isArray(batch?.results) ? batch.results : [])
          const version = String(rows[0]?.value ?? '')
          if (version !== '30') throw new Error(`STAGING_SCHEMA_VERSION_INVALID:${version}`)
          NODE

      - name: Build SPA for same commit
        run: npm run build

      - name: Deploy exact release to staging
        working-directory: apps/edge-api
        run: npx wrangler deploy --env staging

      - name: Wait for staging health and readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            hs="$(curl --silent --show-error --max-time 10 -o /tmp/h.json -w '%{http_code}' "$YUISYNC_STAGING_URL/health" || true)"
            rs="$(curl --silent --show-error --max-time 10 -o /tmp/r.json -w '%{http_code}' "$YUISYNC_STAGING_URL/ready" || true)"
            if [ "$hs" = 200 ] && [ "$rs" = 200 ] && node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const h = JSON.parse(await readFile('/tmp/h.json', 'utf8'))
          const r = JSON.parse(await readFile('/tmp/r.json', 'utf8'))
          if (!(h?.status === 'ok' && r?.status === 'ready' && String(r?.checks?.schema_version) === '30')) process.exit(1)
          NODE
            then break; fi
            [ "$attempt" = 12 ] && exit 1
            sleep 5
          done
          curl --fail --silent --show-error "$YUISYNC_STAGING_URL/" > /dev/null

      - name: Prepare ephemeral Better Auth smoke users
        id: e2e-fixtures
        run: node scripts/migration/staging-e2e-fixtures.mjs setup

      - name: Smoke Better Auth over HTTP
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { request } from '@playwright/test'
          const baseURL = String(process.env.YUISYNC_STAGING_URL || '').replace(/\/$/, '')
          const email = String(process.env.E2E_EMAIL || '')
          const password = String(process.env.E2E_PASSWORD || '')
          if (!baseURL.startsWith('https://') || !email.endsWith('@staging.invalid') || password.length < 12) {
            throw new Error('STAGING_AUTH_SMOKE_INPUT_INVALID')
          }
          const api = await request.newContext({ baseURL, extraHTTPHeaders: { origin: baseURL } })
          try {
            const signIn = await api.post('/api/auth/sign-in/email', { data: { email, password, rememberMe: false } })
            if (signIn.status() !== 200) throw new Error(`STAGING_AUTH_SIGN_IN_FAILED:${signIn.status()}`)
            const session = await api.get('/api/auth/get-session')
            if (session.status() !== 200) throw new Error(`STAGING_AUTH_SESSION_FAILED:${session.status()}`)
            const body = await session.json()
            if (String(body?.user?.email || '').toLowerCase() !== email.toLowerCase()) throw new Error('STAGING_AUTH_SESSION_USER_MISMATCH')
            console.log(JSON.stringify({ status: 'passed', better_auth_sign_in: true, session_roundtrip: true }))
          } finally {
            await api.dispose()
          }
          NODE

      - name: Clean ephemeral Better Auth smoke users
        if: always() && steps.e2e-fixtures.outcome == 'success'
        run: node scripts/migration/staging-e2e-fixtures.mjs cleanup

      - name: Upload staging release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-staging-release-${{ env.RELEASE_SHA }}
          path: .artifacts/staging-certification/
          if-no-files-found: warn
          retention-days: 14

      - name: Promotion summary
        if: success()
        run: |
          echo '## Fast Cloudflare staging promotion' >> "$GITHUB_STEP_SUMMARY"
          echo "- Release SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 + AUTH_DB migrations: applied' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime schema: v30' >> "$GITHUB_STEP_SUMMARY"
          echo '- /health + /ready: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Better Auth sign-in + session HTTP smoke: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser E2E and edge:check: intentionally not repeated; covered by Quality' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish auditable result to authorization issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Fast staging promotion result\n\n- Release-SHA: \`$RELEASE_SHA\`\n- Result: **$JOB_STATUS**\n- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nProduction remains separately gated."
