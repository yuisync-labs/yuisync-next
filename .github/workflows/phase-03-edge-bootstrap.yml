# Retry after registering the new npm workspace in the lockfile.
name: Phase 3 edge bootstrap

on:
  push:
    branches:
      - phase/03-cloudflare-foundation
    paths:
      - .github/workflows/phase-03-edge-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/03-cloudflare-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Register edge workspace and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --workspace apps/edge-api hono
          npm install --workspace apps/edge-api --save-dev wrangler @cloudflare/vitest-pool-workers vitest typescript

      - name: Generate typed bindings
        run: npm run edge:types

      - name: Validate edge and baseline
        run: |
          npm run audit:ci
          npm run edge:check
          npm run typecheck
          npm run typecheck:contracts
          npm run check:contract-boundaries
          npm run test:contracts
          npm run test
          npm run test:petbot
          npm run test:luna:unit
          npm run test:luna:regressions
          npm run test:luna:eval
          npm run test:transactions
          npm run build

      - name: Commit validated dependency metadata
        run: |
          git config user.name 'yuisync-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json apps/edge-api/package.json apps/edge-api/worker-configuration.d.ts
          git commit -m 'feat: install and validate edge runtime foundation'
          git push origin HEAD:phase/03-cloudflare-foundation
