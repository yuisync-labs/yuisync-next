name: Delivery2 print cleanup

on:
  push:
    branches:
      - codex/delivery2-packages-commissions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/delivery2-packages-commissions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Apply guarded print cleanup
        run: node scripts/delivery2-print-cleanup.mjs
      - name: Focused commission tests
        run: npx vitest run src/modules/petshop/lib/teamCommissionSummary.test.js src/modules/petshop/lib/packageCommissionOperations.test.js src/modules/petshop/lib/delivery2CommissionPresentation.test.js
      - name: Product UI boundary
        run: npm run check:product-ui
      - name: Build
        run: npm run build
      - name: Commit validated cleanup
        run: |
          rm .github/workflows/delivery2-print-cleanup.yml scripts/delivery2-print-cleanup.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(delivery2): use shared receipt preview for team summaries"
          git push origin HEAD:codex/delivery2-packages-commissions
