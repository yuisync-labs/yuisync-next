name: Quality

on:
  pull_request:
  push:
    branches: [main, architecture/cloudflare-foundation, "phase/**"]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run audit:ci

  edge-runtime:
    name: Cloudflare edge runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run edge:check

  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:no-runtime-supabase
      - run: npm run check:edge-compat-surface
      - run: node scripts/check-inventory-write-boundary.mjs
      - run: npm run check:whatsapp-edge-boundaries
      - run: npm run typecheck
      - run: npm run typecheck:contracts
      - run: npm run check:contract-boundaries
      - run: npm run check:product-ui
      - run: npm run check:no-domain-state-from-dom
      - run: npm run check:appointment-edit-semantics
      - run: npm run check:planos-native-commands
      - run: >-
          npm run check:frontend-compat-ratchet --
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: npm run test:contracts
      - run: npm run test
      - run: npm run test:petbot
      - run: npm run test:luna:unit
      - run: npm run test:luna:regressions
      - id: luna-eval-impact
        name: Select Luna eval scenarios by impact
        run: >-
          node scripts/select-luna-evals.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.sha }}"
      - name: Luna deterministic evals
        run: npm run test:luna:eval -- --groups "${{ steps.luna-eval-impact.outputs.groups }}"
      - run: npm run test:transactions
      - name: Legacy acceptance 233/233
        run: node scripts/run-legacy-acceptance-233.mjs
      - id: tenant-readiness
        name: Check tenant isolation credentials
        run: >-
          node scripts/check-ci-secrets.mjs tenant-isolation
          SUPABASE_URL SUPABASE_ANON_KEY
          TENANT_A_EMAIL TENANT_A_PASSWORD TENANT_A_ID
          TENANT_B_EMAIL TENANT_B_PASSWORD TENANT_B_ID
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TENANT_A_EMAIL: ${{ secrets.TENANT_A_EMAIL }}
          TENANT_A_PASSWORD: ${{ secrets.TENANT_A_PASSWORD }}
          TENANT_A_ID: ${{ secrets.TENANT_A_ID }}
          TENANT_B_EMAIL: ${{ secrets.TENANT_B_EMAIL }}
          TENANT_B_PASSWORD: ${{ secrets.TENANT_B_PASSWORD }}
          TENANT_B_ID: ${{ secrets.TENANT_B_ID }}
      - name: Tenant isolation
        if: steps.tenant-readiness.outputs.configured == 'true'
        run: npm run test:tenant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TENANT_A_EMAIL: ${{ secrets.TENANT_A_EMAIL }}
          TENANT_A_PASSWORD: ${{ secrets.TENANT_A_PASSWORD }}
          TENANT_A_ID: ${{ secrets.TENANT_A_ID }}
          TENANT_B_EMAIL: ${{ secrets.TENANT_B_EMAIL }}
          TENANT_B_PASSWORD: ${{ secrets.TENANT_B_PASSWORD }}
          TENANT_B_ID: ${{ secrets.TENANT_B_ID }}
          REQUIRE_TENANT_ISOLATION_TESTS: '1'
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - id: e2e-readiness
        name: Check E2E credentials
        run: >-
          node scripts/check-ci-secrets.mjs e2e
          E2E_BASE_URL E2E_EMAIL E2E_PASSWORD
          E2E_COMMON_EMAIL E2E_COMMON_PASSWORD
          E2E_MANAGER_EMAIL E2E_MANAGER_PASSWORD
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COMMON_EMAIL: ${{ secrets.E2E_COMMON_EMAIL }}
          E2E_COMMON_PASSWORD: ${{ secrets.E2E_COMMON_PASSWORD }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      - name: Install Playwright Chromium
        if: steps.e2e-readiness.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Desktop E2E
        if: steps.e2e-readiness.outputs.configured == 'true'
        run: npm run test:e2e -- --project=desktop
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_COMMON_EMAIL: ${{ secrets.E2E_COMMON_EMAIL }}
          E2E_COMMON_PASSWORD: ${{ secrets.E2E_COMMON_PASSWORD }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
