name: Quality

on:
  pull_request:
  push:
    branches: [main, architecture/cloudflare-foundation, "phase/**"]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run audit:ci

  edge-runtime:
    name: Cloudflare edge runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run edge:check

  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:no-runtime-supabase
      - run: npm run check:edge-compat-surface
      - run: node scripts/check-inventory-write-boundary.mjs
      - run: npm run check:whatsapp-edge-boundaries
      - run: npm run typecheck
      - run: npm run typecheck:contracts
      - run: npm run check:contract-boundaries
      - run: npm run check:product-ui
      - run: npm run check:no-domain-state-from-dom
      - run: npm run check:appointment-edit-semantics
      - run: npm run check:planos-native-commands
      - run: >-
          npm run check:frontend-compat-ratchet --
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: npm run test:contracts
      - run: npm run test
      - run: npm run test:petbot
      - run: npm run test:luna:unit
      - run: npm run test:luna:regressions
      - id: luna-eval-impact
        name: Select Luna eval scenarios by impact
        run: >-
          node scripts/select-luna-evals.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.sha }}"
      - name: Luna deterministic evals
        run: npm run test:luna:eval -- --groups "${{ steps.luna-eval-impact.outputs.groups }}"
      - run: npm run test:transactions
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Local public browser smoke
        run: npx playwright test test/e2e/public-smoke.spec.js --project=desktop
        env:
          E2E_PUBLIC_SMOKE_LOCAL: '1'
      - name: Local agenda drag regression
        run: npx playwright test --config playwright.local.config.js
