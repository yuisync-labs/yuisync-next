name: Edge staging rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      staging_url:
        description: HTTPS workers.dev URL used for smoke tests after rollback
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm immediate traffic replacement
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false

jobs:
  prepare:
    name: Authorize rollback request
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.request.outputs.authorized }}
      version_id: ${{ steps.request.outputs.version_id }}
      staging_url: ${{ steps.request.outputs.staging_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve protected rollback request
        id: request
        env:
          INPUT_VERSION_ID: ${{ inputs.version_id }}
          INPUT_STAGING_URL: ${{ inputs.staging_url }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = "ROLLBACK"

          VERSION_ID="$INPUT_VERSION_ID"
          STAGING_URL="$INPUT_STAGING_URL"

          [[ "$VERSION_ID" =~ ^[0-9a-fA-F-]{20,64}$ ]]
          [[ "$STAGING_URL" =~ ^https://[a-zA-Z0-9.-]+(/.*)?$ ]]

          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "staging_url=$STAGING_URL" >> "$GITHUB_OUTPUT"

  rollback:
    name: Roll back and smoke test staging
    needs: prepare
    if: needs.prepare.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-staging
      url: ${{ needs.prepare.outputs.staging_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Validate scoped Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci
      - run: npm run edge:check

      - name: Restore selected Worker version
        id: rollback
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: apps/edge-api
          command: >-
            rollback ${{ needs.prepare.outputs.version_id }}
            --env staging
            --message "Rollback requested from GitHub Actions run ${{ github.run_id }}"

      - name: Smoke test restored Worker
        env:
          EDGE_STAGING_URL: ${{ needs.prepare.outputs.staging_url }}
        run: npm run edge:smoke -- "$EDGE_STAGING_URL"

      - name: Record rollback summary
        env:
          VERSION_ID: ${{ needs.prepare.outputs.version_id }}
          EDGE_STAGING_URL: ${{ needs.prepare.outputs.staging_url }}
        run: |
          echo "## Edge staging rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored version: \`${VERSION_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${EDGE_STAGING_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health, readiness and sanitized 404: passed" >> "$GITHUB_STEP_SUMMARY"
