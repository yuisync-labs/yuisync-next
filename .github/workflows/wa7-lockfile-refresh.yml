name: WA7 lockfile refresh

on:
  push:
    branches: [agent/wa7-cutover-prep]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/wa7-cutover-prep
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - name: Refresh missing read-excel-file lock entries
        run: npm install read-excel-file@9.3.5 --save-exact --package-lock-only --ignore-scripts
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: synchronize read-excel-file lockfile"
          git push origin HEAD:agent/wa7-cutover-prep
