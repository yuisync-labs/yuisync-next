name: Luna language batch (1000 neurons)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false
jobs:
  language:
    if: >-
      github.run_attempt == 1 &&
      (github.ref == 'refs/heads/codex/luna-think-language-test-plan' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/luna-think-language-test-plan'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: node --test test/lunaLanguageBudgetProxy.test.mjs
      - run: npm run edge:typecheck
      - name: Verify persistent cold-start bridge without Workers AI
        working-directory: apps/edge-api
        run: npx vitest run --config vitest.language-fixture.config.ts
      - name: Run authorized queue in serial batches of at most three cases
        run: node scripts/luna/runLanguageQueue.mjs
      - name: Reconcile usage, release idle hold and delete temporary proxy
        if: always()
        run: node scripts/luna/runLanguageBatch.mjs finish
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: luna-language-batch-${{ github.run_id }}
          path: .artifacts/luna-language/
          if-no-files-found: ignore
