name: Observe Luna language budget (no inference)
on:
  push:
    branches: [codex/luna-think-language-test-plan]
    paths: [.github/workflows/luna-language-observe.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Read account usage and active test batch without invoking AI
        run: |
          node --input-type=module <<'JS'
          import {accountUsage,ACCOUNT} from './scripts/luna/languageBatchBudget.mjs'
          async function cf(path){const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+path,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const d=await r.json();if(!r.ok||!d.success)throw Error('READ_ONLY_STATUS_FAILED');return d.result}
          const usage=await accountUsage(),scripts=await cf('/workers/scripts'),active=[]
          for(const script of scripts.filter(s=>s.id.startsWith('luna-language-budget-39834577879'))){
           const settings=await cf('/workers/scripts/'+script.id+'/settings')
           const value=name=>settings.bindings.find(b=>b.name===name)?.text
           active.push({batchIndex:script.id.slice(-2),active:value('BATCH_ACTIVE'),day:value('BATCH_DAY'),counterAtStart:Number(value('BATCH_START_USED')),cap:Number(value('BATCH_MAX'))})
          }
          console.log(JSON.stringify({event:'language.readonly.snapshot',usage,active}))
          JS
