name: PR60 codemod

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ github.event.pull_request.head.ref == 'hardening/agenda-declarative-package-state' && !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/agenda-declarative-package-state
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/agent-pr60-codemod.mjs
      - run: |
          rm scripts/agent-pr60-codemod.mjs .github/workflows/agent-pr60-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/pages/AgendaPage.jsx src/shared/hooks/useAppointments.js package.json .github/workflows/quality.yml scripts/check-no-domain-state-from-dom.mjs src/modules/petshop/components/AgendaCardLayoutEnhancer.jsx src/modules/petshop/components/AgendaBillingLabel.jsx src/modules/petshop/components/AgendaBillingLabel.test.jsx src/modules/petshop/lib/appointmentBillingPresentation.js
          git add -u scripts/agent-pr60-codemod.mjs .github/workflows/agent-pr60-codemod.yml
          git commit -m "refactor(agenda): make package state declarative [pr60-codemod]"
          git push origin HEAD:hardening/agenda-declarative-package-state
