name: Delivery2 branch patch

on:
  push:
    branches:
      - codex/delivery2-packages-commissions

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/delivery2-packages-commissions
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Normalize guarded patch source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-delivery2-packages-commissions.mjs')
          text = path.read_text()

          simple = [
              ("movement.quantity > 1 ? ` · ${movement.quantity}x` : ''", "movement.quantity > 1 ? ' · ' + movement.quantity + 'x' : ''"),
              ("movement.origin_known ? `Atendimento: ${movement.appointment_id}` : 'Origem: ajuste sem atendimento vinculado'", "movement.origin_known ? 'Atendimento: ' + movement.appointment_id : 'Origem: ajuste sem atendimento vinculado'"),
          ]
          for old, new in simple:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected nested expression once: {old!r}; found {count}')
              text = text.replace(old, new)

          label = "label: 'commission missing rule panel'"
          label_pos = text.find(label)
          if label_pos < 0:
              raise SystemExit('commission missing rule panel label not found')

          from_old = '    from: `          <div className="tbl-wrapper overflow-x-auto">`,'
          from_pos = text.find(from_old, label_pos)
          if from_pos < 0:
              raise SystemExit('commission panel from-anchor not found')
          from_new = '    from: `          <div className="tbl-wrapper overflow-x-auto">\n            <table className="tbl min-w-[1130px]">`,'
          text = text[:from_pos] + from_new + text[from_pos + len(from_old):]

          to_pos = text.find('    to: `', from_pos + len(from_new))
          if to_pos < 0:
              raise SystemExit('commission panel to-block not found')
          table_old = '          <div className="tbl-wrapper overflow-x-auto">`'
          table_pos = text.find(table_old, to_pos)
          if table_pos < 0:
              raise SystemExit('commission panel output table anchor not found')
          table_new = '          <div className="tbl-wrapper overflow-x-auto">\n            <table className="tbl min-w-[1130px]">`'
          text = text[:table_pos] + table_new + text[table_pos + len(table_old):]

          whitespace_old = '      {viewingBenefits && <BenefitLedgerModal subscription={viewingBenefits} activeTenantId={activeTenantId} moduleId={moduleId} onClose={() => setViewingBenefits(null)}/>} '
          whitespace_new = whitespace_old.rstrip()
          count = text.count(whitespace_old)
          if count != 1:
              raise SystemExit(f'benefit modal trailing-space source expected once, found {count}')
          text = text.replace(whitespace_old, whitespace_new)

          path.write_text(text)
          PY

      - name: Apply guarded Delivery 2 patch
        run: node scripts/apply-delivery2-packages-commissions.mjs

      - name: Focused frontend contracts
        run: npx vitest run src/modules/petshop/lib/subscriptionUsageAdmin.test.js src/modules/petshop/lib/teamCommissionSummary.test.js src/modules/petshop/lib/packageCommissionOperations.test.js src/modules/petshop/lib/delivery2CommissionPresentation.test.js

      - name: Focused package ledger Edge tests
        run: npm run test --workspace @yuisync/edge-api -- subscriptionBenefitLedgerProjection.test.ts packageUsageLedgerV29.test.ts petshopSubscriptionReadV30.test.ts

      - name: Edge typecheck
        run: npm run edge:typecheck

      - name: Native package command boundary
        run: npm run check:planos-native-commands

      - name: Product UI boundary
        run: npm run check:product-ui

      - name: Build
        run: npm run build

      - name: Commit validated Delivery 2 integration
        run: |
          rm .github/workflows/delivery2-branch-patch.yml scripts/apply-delivery2-packages-commissions.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(delivery2): clarify package balances and commissions" || exit 0
          git push origin HEAD:codex/delivery2-packages-commissions
