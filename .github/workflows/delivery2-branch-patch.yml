name: Delivery2 branch patch

on:
  push:
    branches:
      - codex/delivery2-packages-commissions

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/delivery2-packages-commissions
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Normalize nested JSX expressions in patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-delivery2-packages-commissions.mjs')
          text = path.read_text()
          replacements = {
              "movement.quantity > 1 ? ` · ${movement.quantity}x` : ''": "movement.quantity > 1 ? ' · ' + movement.quantity + 'x' : ''",
              "movement.origin_known ? `Atendimento: ${movement.appointment_id}` : 'Origem: ajuste sem atendimento vinculado'": "movement.origin_known ? 'Atendimento: ' + movement.appointment_id : 'Origem: ajuste sem atendimento vinculado'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected nested expression once: {old!r}; found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Apply guarded Delivery 2 patch
        run: node scripts/apply-delivery2-packages-commissions.mjs

      - name: Focused frontend contracts
        run: npx vitest run src/modules/petshop/lib/subscriptionUsageAdmin.test.js src/modules/petshop/lib/teamCommissionSummary.test.js src/modules/petshop/lib/packageCommissionOperations.test.js

      - name: Focused package ledger Edge tests
        run: npm run test --workspace @yuisync/edge-api -- subscriptionBenefitLedgerProjection.test.ts packageUsageLedgerV29.test.ts petshopSubscriptionReadV30.test.ts

      - name: Edge typecheck
        run: npm run edge:typecheck

      - name: Native package command boundary
        run: npm run check:planos-native-commands

      - name: Product UI boundary
        run: npm run check:product-ui

      - name: Build
        run: npm run build

      - name: Commit validated Delivery 2 integration
        run: |
          rm .github/workflows/delivery2-branch-patch.yml scripts/apply-delivery2-packages-commissions.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(delivery2): clarify package balances and commissions" || exit 0
          git push origin HEAD:codex/delivery2-packages-commissions
