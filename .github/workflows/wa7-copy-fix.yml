name: WA7 final review copy fix

on:
  push:
    branches: [agent/wa7-cutover-prep]

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/wa7-cutover-prep
      - name: Replace stale WA4/WA5 review copy and remove this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('src/shared/pages/MetaWhatsappPage.jsx')
          text = page.read_text()
          old = 'The legacy review sender remains unchanged in WA4. Outbound will move to the tenant credential path in WA5.'
          new = 'Connect a WhatsApp Business number to this tenant before sending. Outbound uses the tenant-scoped credential stored encrypted on the Cloudflare Worker.'
          if old not in text:
              raise SystemExit('stale review copy not found')
          page.write_text(text.replace(old, new, 1))
          Path('.github/workflows/wa7-copy-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/pages/MetaWhatsappPage.jsx .github/workflows/wa7-copy-fix.yml
          git commit -m "docs(whatsapp): refresh Meta review messaging"
          git push origin HEAD:agent/wa7-cutover-prep
