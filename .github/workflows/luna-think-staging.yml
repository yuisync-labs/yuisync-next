name: Luna Think staging
on:
  push:
    branches: [codex/luna-think-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YUISYNC_E2E_BASE_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run edge:typecheck && npm run typecheck
      - run: npm run test:think
      - run: npm run test --workspace @yuisync/edge-api -- test/chatQualityApi.test.ts test/lunaAiBudget.test.ts
      - run: npm test -- src/lib/internalChatApi.test.js src/lib/lunaTurnPolling.test.js
      - run: npm run build && npm run deploy:dry-run --workspace @yuisync/edge-api
      - name: Apply additive staging migrations
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env staging --remote
          npx wrangler d1 migrations apply AUTH_DB --env staging --remote
      - name: Prepare disposable authenticated tenants
        run: node scripts/migration/staging-e2e-fixtures.mjs setup
      - name: Read today's account usage
        run: node scripts/luna/staging-budget-baseline.mjs
      - name: Deploy staging with a single authorized test tenant
        working-directory: apps/edge-api
        run: >-
          npx wrangler deploy --env staging
          --var "LUNA_THINK_TENANT_IDS:$TENANT_A_ID"
          --var "LUNA_AI_BASELINE_DATE:$LUNA_AI_BASELINE_DATE"
          --var "LUNA_AI_BASELINE_NEURONS:$LUNA_AI_BASELINE_NEURONS"
          --var "RELEASE_SHA:$GITHUB_SHA"
      - name: Verify staging health
        run: npm run edge:smoke -- "$YUISYNC_E2E_BASE_URL"
      - run: npx playwright install --with-deps chromium
      - name: Verify native AI, debounce, permissions and quality UI
        run: |
          set -o pipefail
          node scripts/luna/staging-think-smoke.mjs 2>&1 | tee smoke.log
        env:
          LUNA_INBOX_DEBOUNCE_MS: "0"
      - name: Enable verified QuatroPatas staging pilot
        run: node scripts/luna/staging-activate-pilot.mjs
      - name: Report a failed smoke on the pull request
        if: failure() && hashFiles('smoke.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open" --jq '.[0].number')
          if [ -n "$pr" ]; then printf '## Smoke do staging falhou\n\nNeurons usados hoje antes do deploy: %s\n\n```\n%s\n```\n' "$LUNA_AI_BASELINE_NEURONS" "$(tail -c 3000 smoke.log)" > smoke.md; gh pr comment "$pr" --repo "${{ github.repository }}" --body-file smoke.md; fi
      - name: Clean disposable records
        if: always()
        run: node scripts/migration/staging-e2e-fixtures.mjs cleanup
  language:
    permissions:
      contents: read
      pull-requests: write
    # Real-model conversation battery against the code just deployed. It runs only
    # when .github/luna-language-request.json sets "run": true, one case at a
    # time, until Workers AI refuses for lack of free daily neurons.
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        run: echo "run=$(node -p "JSON.parse(require('fs').readFileSync('.github/luna-language-request.json','utf8')).run===true")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: Verify persistent cold-start bridge without Workers AI
        working-directory: apps/edge-api
        run: npx vitest run --config vitest.language-fixture.config.ts
      - if: steps.gate.outputs.run == 'true'
        name: Run the requested cases until Workers AI refuses for daily neurons
        working-directory: apps/edge-api
        run: |
          export LANG_CASE_IDS=$(node -p "JSON.parse(require('fs').readFileSync('../../.github/luna-language-request.json','utf8')).cases.join(',')")
          npx vitest run --config vitest.language-live.config.ts
      - if: always() && steps.gate.outputs.run == 'true'
        name: Report results on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/luna/languageReport.mjs
          pr=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open" --jq '.[0].number')
          if [ -n "$pr" ]; then printf '%s\n\n[Execução](%s)\n' "$(cat .artifacts/luna-language/report.md)" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > comment.md; gh pr comment "$pr" --repo "${{ github.repository }}" --body-file comment.md; fi
      - uses: actions/upload-artifact@v6
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: luna-language-batch-${{ github.run_id }}
          path: .artifacts/luna-language/
          if-no-files-found: ignore
