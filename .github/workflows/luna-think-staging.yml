name: Luna Think staging
on:
  push:
    branches: [codex/luna-think-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-staging-deployment
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YUISYNC_E2E_BASE_URL: https://yuisync-edge-api-staging.gabrielboalento3004.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run edge:typecheck && npm run typecheck
      - run: npm run test:think
      - run: npm run test --workspace @yuisync/edge-api -- test/chatQualityApi.test.ts test/lunaAiBudget.test.ts
      - run: npm test -- src/lib/internalChatApi.test.js src/lib/lunaTurnPolling.test.js
      - run: npm run build && npm run deploy:dry-run --workspace @yuisync/edge-api
      - name: Apply additive staging migrations
        working-directory: apps/edge-api
        run: |
          npx wrangler d1 migrations apply DB --env staging --remote
          npx wrangler d1 migrations apply AUTH_DB --env staging --remote
      - name: Prepare disposable authenticated tenants
        run: node scripts/migration/staging-e2e-fixtures.mjs setup
      - name: Read today's account usage
        run: node scripts/luna/staging-budget-baseline.mjs
      - name: Deploy staging with a single authorized test tenant
        working-directory: apps/edge-api
        run: >-
          npx wrangler deploy --env staging
          --var "LUNA_THINK_TENANT_IDS:$TENANT_A_ID"
          --var "LUNA_AI_BASELINE_DATE:$LUNA_AI_BASELINE_DATE"
          --var "LUNA_AI_BASELINE_NEURONS:$LUNA_AI_BASELINE_NEURONS"
          --var "RELEASE_SHA:$GITHUB_SHA"
      - name: Verify staging health
        run: npm run edge:smoke -- "$YUISYNC_E2E_BASE_URL"
      - run: npx playwright install --with-deps chromium
      - name: Verify native AI, debounce, permissions and quality UI
        run: node scripts/luna/staging-think-smoke.mjs
      - name: Enable verified QuatroPatas staging pilot
        run: node scripts/luna/staging-activate-pilot.mjs
      - name: Clean disposable records
        if: always()
        run: node scripts/migration/staging-e2e-fixtures.mjs cleanup
