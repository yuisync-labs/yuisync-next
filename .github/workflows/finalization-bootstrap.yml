name: Finalization bootstrap

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalization-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.label.name == 'finalization-bootstrap' &&
      github.event.pull_request.base.ref == 'architecture/cloudflare-foundation' &&
      github.event.pull_request.head.ref == 'phase/08-finalization' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - name: Refresh reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies for guarded bootstrap
        run: npm ci --ignore-scripts
      - name: Provision or reuse staging AUTH_DB
        run: node scripts/bootstrap-cloudflare-auth-db.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Store Better Auth secret without logging it
        shell: bash
        run: |
          set +x
          BETTER_AUTH_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          printf '%s' "$BETTER_AUTH_SECRET" | npm exec --workspace @yuisync/edge-api -- wrangler secret put BETTER_AUTH_SECRET --env staging
          unset BETTER_AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Generate Worker binding types
        run: npm run edge:types
      - name: Commit generated lockfile and AUTH_DB binding
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json apps/edge-api/wrangler.jsonc apps/edge-api/worker-configuration.d.ts; then
            echo 'No bootstrap files changed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json apps/edge-api/wrangler.jsonc apps/edge-api/worker-configuration.d.ts
            git commit -m 'Bootstrap staging Better Auth database'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Verify generated config and build
        run: |
          npm run build
          npm run edge:typecheck
