name: Delivery1 refresh transaction contracts

on:
  push:
    branches:
      - codex/tenant-settings-receipts

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/tenant-settings-receipts
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh obsolete fixed-width receipt contracts
        run: node scripts/refresh-delivery1-transaction-contracts.mjs

      - name: Run transaction and contract tests
        run: npm run test:transactions

      - name: Commit refreshed contracts
        run: |
          rm .github/workflows/delivery1-refresh-transaction-contracts.yml
          rm scripts/refresh-delivery1-transaction-contracts.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(receipts): align transaction contracts with shared printing"
          git push origin HEAD:codex/tenant-settings-receipts
